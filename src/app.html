*{box-sizing:border-box}
html{background:var(--bg);color:var(--fg)}
body{background:var(--bg) var(--pattern) repeat;background-size:220px 330px;color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:var(--fg)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
[dir="rtl"] .flip{transform:scaleX(-1)}

.app{max-width:460px;margin:0 auto;min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:14px 12px;display:flex;flex-direction:column;gap:12px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.mapbox{position:relative;height:calc(100vh - var(--nav-h) - 150px - env(safe-area-inset-bottom,0px) - env(safe-area-inset-top,0px));min-height:380px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--mapland)}
#mapsvg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#mapsvg:active{cursor:grabbing}
.m-land{fill:var(--mapland)} .m-sea{fill:var(--mapsea)} .m-rock{fill:var(--maprock)}
.m-wadi{fill:none;stroke:var(--mapgreen);stroke-width:26;stroke-linecap:round;stroke-linejoin:round}
.m-road{fill:none;stroke:var(--maproad);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.m-road.big{stroke-width:9}
.pin{cursor:pointer}
.pin path{stroke:var(--surface);stroke-width:2}
.pin circle{fill:var(--surface)}
.pk-heritage path{fill:var(--i-heritage)} .pk-culture path{fill:var(--i-culture)} .pk-nature path{fill:var(--i-nature)} .pk-shopping path{fill:var(--i-shopping)} .pk-entertainment path{fill:var(--i-entertainment)} .pk-meal path{fill:var(--i-meal)} .pk-hotel path{fill:var(--i-hotel)}
.pin.sel path{fill:var(--accent)}

function priceTxt(p,s){
  if(p.cat==='hotel') return t('hotelPrice');

function similarList(){
  const pl=curPlan(), cur=sheetPlace(), stop=sheetStop(), inPlan=new Set(pl.days.flat().map(x=>x.id));
  if(SC.type==='hotel') return HOTELS.filter(h=>h.id!==pl.hotel&&h.ll).sort((a,b)=>(a.tier===cur.tier?0:1)-(b.tier===cur.tier?0:1)||PL.km(a.ll,cur.ll)-PL.km(b.ll,cur.ll));
  const meal=SLOTN[stop.slot];
  let c=PICKABLE.filter(p=>!inPlan.has(p.id)&&(meal?(stop.slot==='breakfast'?PL.isBreakfast(p):PL.isMeal(p)):(p.g===cur.g&&!PL.isMeal(p)&&p.cat!=='cafe')));
  if(!c.length&&!meal) c=PICKABLE.filter(p=>!inPlan.has(p.id)&&!PL.isMeal(p)&&p.cat!=='cafe');
  const date=PL.dateOf(pl.form.start,SC.d), cv=stop.cost||0;
  const openAt=p=>{const ll=llOf(p);const eh=PL.effHours(p,p.branches?byId[p.branches[0]].hrs:p.hrs,date,p.branches?byId[p.branches[0]].hs:p.hs);return PL.fits(eh.iv,stop.t,Math.min(p.dur||60,240))?0:1};
  const cost=p=>{const v=PL.costAt(p,stop.t).v;return v==null?cv:v};
  return c.sort((a,b)=>openAt(a)-openAt(b)||Math.abs(cost(a)-cv)-Math.abs(cost(b)-cv)||(PL.km(llOf(a),PL.locOf(D,stop))||99)-(PL.km(llOf(b),PL.locOf(D,stop))||99));
}

  if(reduce||!wrap||!btn||!wrap.animate){finish();return}
  const bar=wrap.querySelector('.stickybar');if(bar)bar.style.visibility='hidden';
  const w=wrap.getBoundingClientRect(),b=btn.getBoundingClientRect();
  const dx=(b.left+b.width/2)-(w.left+w.width/2),dy=(b.top+b.height/2)-Math.max(w.top,0);

document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='in-days'||id==='in-people'){const k=id.slice(3),[mn,mx]=LIM[k];let n=parseInt(e.target.value,10);if(isNaN(n))n=mn;S.form[k]=Math.min(mx,Math.max(mn,n));render()}
  if(id==='in-start'&&!e.target.value){S.form.start=tomorrowISO();render()}
});
document.addEventListener('submit',e=>{if(e.target.id==='loginForm'){e.preventDefault();doLogin()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='in-guide'&&!e.isComposing){e.preventDefault();gSend(e.target.value);return}if(e.key==='Escape'){if(MC)closeModal();else if(SC)closeSheet()}});
(function splash(){
  const el=document.getElementById('splash'); if(!el) return;
  el.innerHTML=`<div class="spl"><div class="spl-shadow"></div><div class="spl-logo">${stampSVG({kind:'logo',rot:-8,seed:7})}</div>
  <div class="stamper"><svg viewBox="0 0 200 260" aria-hidden="true"><defs>
   <linearGradient id="wd1" x1="0" x2="1"><stop offset="0" stop-color="#4A2D18"/><stop offset=".45" stop-color="#7E5130"/><stop offset="1" stop-color="#3F2614"/></linearGradient>
   <linearGradient id="wd2" x1="0" x2="1"><stop offset="0" stop-color="#3F2614"/><stop offset=".5" stop-color="#6E4428"/><stop offset="1" stop-color="#36200F"/></linearGradient>
   <radialGradient id="knob" cx=".38" cy=".35" r=".75"><stop offset="0" stop-color="#9A6840"/><stop offset=".6" stop-color="#5E3A20"/><stop offset="1" stop-color="#36200F"/></radialGradient></defs>
   <ellipse cx="100" cy="42" rx="44" ry="36" fill="url(#knob)"/>
   <path d="M83 70 L79 150 H121 L117 70 Z" fill="url(#wd2)"/>
   <rect x="56" y="144" width="88" height="18" rx="8" fill="url(#wd2)"/>
   <rect x="10" y="158" width="180" height="64" rx="12" fill="url(#wd1)"/>
   <rect x="10" y="158" width="180" height="10" rx="5" fill="#9A6840" opacity=".5"/>
   <path d="M30 176 C70 172 130 180 170 174" stroke="#2E1A0C" stroke-width="2" fill="none" opacity=".5"/>
   <path d="M26 196 C80 192 120 200 174 194" stroke="#2E1A0C" stroke-width="2" fill="none" opacity=".4"/>
   <rect x="16" y="220" width="168" height="20" rx="4" fill="var(--stamp)"/></svg></div></div>`;
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),500)},reduce?900:2300);
})();
render();
</script>
</body>
